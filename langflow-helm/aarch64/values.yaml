imagePullSecrets: []

nameOverride: "langflow-service"
# Override for the name of the helm deployment
# Note: using `langflow` as service name causes
# env var collision when deploying on openshift
# https://github.com/langflow-ai/langflow/issues/4330#issuecomment-2459097917
fullnameOverride: "langflow-service"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the
  # fullname template
  name: ""

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/app-root: /login
  hosts:
    - host: langflow.64bit.kr
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  runAsGroup: 1000

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true
  runAsGroup: 1000


langflow:
  global:
    image:
      tag: "aarch64"
  frontend:
    image:
      repository: docker.io/bahn1075/langflow-frontend-custom
      tag: aarch64-20260410-2221
      imagePullPolicy: Always
  backend:
    replicaCount: 1
    service:
      type: ClusterIP
      port: 7860
    backendOnly: false
    numWorkers: 1
    image:
      repository: docker.io/bahn1075/langflow-custom
      imagePullPolicy: Always
      tag: aarch64-20260410-2221
    command:
      - python
      - -m
      - langflow
      - run
      - --host
      - 0.0.0.0
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 0.5
        memory: 3Gi
    probe:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5
      initialDelaySeconds: 5
    autoLogin: false
    superuser: "admin"
    superuserPassword: "changeme"
    env:
      - name: LANGFLOW_PORT
        value: "7860"
      - name: LANGFLOW_ALEMBIC_LOG_FILE
        value: "/app/db/alembic.log"
      - name: LANGFLOW_UPDATE_STARTER_PROJECTS
        value: "false"
      - name: LANGFLOW_MAX_FILE_SIZE_UPLOAD
        value: "100"  # 100MB
      - name: DOCLING_ALLOW_EXTERNAL_PLUGINS
        value: "true"
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: 9090
      prometheus.io/path: "/metrics"

    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      runAsGroup: 1000

    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
      runAsGroup: 1000

    externalDatabase:
      enabled: true
      driver:
        value: "postgresql"
      host:
        value: "postgresql.postgres.svc.cluster.local"
      port:
        value: "5432"
      user:
        value: "postgres"
      password:
        value: "postgres123"
      database:
        value: "postgres"

    volumes:
      - name: langflow-fss
        persistentVolumeClaim:
          claimName: langflow-fss-pvc
      - name: tmp
        emptyDir: {}

    volumeMounts:
      - name: langflow-fss
        mountPath: /app/flows
        subPath: langflow/flows
      - name: tmp
        mountPath: /tmp
        readOnly: false
      - name: langflow-fss
        mountPath: /app/data
        subPath: langflow/data
      - name: langflow-fss
        mountPath: /app/db
        subPath: langflow/db

    sqlite:
      enabled: false
      volume:
        size: "1Gi"
        existingStorageClassName: "default"
        # If you want the chart to create storage classes, then don't set
        # existingStorageClassName name and provide configuration values
        # for the storage class. The settings vary based on cloud
        # provider. Below are examples for AWS, GCP, and Azure.

        # For AWS
        # storageClass:
        #  provisioner: kubernetes.io/aws-ebs
        #  type: gp2
        #  fsType: ext4
        #  extraParams:
        #     iopsPerGB: "10"

        # For GCP
        # storageClass:
        #   provisioner: kubernetes.io/gce-pd
        #   type: pd-ssd
        #   fsType: ext4
        #   extraParams:
        #      replication-type: none

        # For Azure
        # storageClass:
        #   provisioner: kubernetes.io/azure-disk
        #   fsType: ext4
        #   type: managed-premium
        #   extraParams:
        #     storageaccounttype: Premium_LRS
        #     kind: Managed
        #     cachingmode: ReadOnly
        storageClass: {}

    autoLogin: false          # require users to log in before seeing flows
    superuser: "admin"        # change this to your desired admin username
    superuserPassword: "changeme"  # set a strong password or handle via secret
    # secretKey: <encryption key, optional>
    # newUserIsActive: true|false


secretProvider:
  enabled: false

postgresql:
  enabled: false
